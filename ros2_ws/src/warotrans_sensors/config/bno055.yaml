# GY-BNO055 on Pi I2C-1 — see docs/calibration.md §8
# Covariance diagonals are PROVISIONAL until static/dynamic characterization.

bno055_node:
  ros__parameters:
    i2c_bus: 1
    i2c_address: 0x29
    frame_id: imu_link
    publish_rate_hz: 50.0
    # Diagonal entries for orientation / gyro / accel (SI units^2)
    orientation_covariance: 0.01
    angular_velocity_covariance: 0.02
    linear_acceleration_covariance: 0.04
