ultrasonic_node:
  ros__parameters:
    # BCM GPIO numbers (NOT physical header pin numbers)
    front_trig_gpio: 17
    front_echo_gpio: 27
    rear_trig_gpio: 22
    rear_echo_gpio: 23
    left_trig_gpio: 24
    left_echo_gpio: 25
    right_trig_gpio: 5
    right_echo_gpio: 6

    # min/max: project defaults for MKE-S01 bring-up — refine after STEP 6 table
    min_range: 0.03
    max_range: 2.0
    speed_of_sound: 343.0
    trigger_pulse_us: 10
    # Phase 0.5 plan defaults (crosstalk: never fire all at once)
    inter_sensor_delay_ms: 50
    # > 2*max_range/c (~11.7 ms) with margin; stuck-HIGH uses echo_recover_ms
    echo_timeout_ms: 25
    echo_recover_ms: 80
    median_window: 3
    field_of_view_deg: 15.0
    # Pi 5 RP1 user GPIO (/dev/gpiochip4, group dialout) — NOT gpiochip0
    gpiochip: 4
    debug_log_period_s: 1.0
