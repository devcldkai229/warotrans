# WaroTrans — RPLIDAR A1 driver configuration
#
# Ownership: package này chỉ sở hữu cấu hình DRIVER. Không chứa tham số SLAM,
# localization hay navigation.
#
# Nguồn số liệu: docs/MASTER_ENGINEERING_GUIDE.md muc 8.3 (Phase 2).
# Không copy baud/scan_mode từ tutorial cho model khác.

rplidar_node:
  ros__parameters:
    # Symlink udev ổn định, không dùng /dev/ttyUSB0 vì thứ tự enumerate đổi
    # theo thứ tự cắm USB giữa LiDAR và ESP32.
    serial_port: /dev/rplidar

    # A1 dùng 115200. Các model khác cùng họ dùng baud khác; sai baud biểu hiện
    # thành "operation timed out" chứ không phải lỗi phần cứng.
    serial_baudrate: 115200

    # Phải khớp link `laser` mà warotrans_description publish qua URDF.
    # Hình học cảm biến thuộc TF, không sửa bằng cách xoay dữ liệu LaserScan.
    frame_id: laser

    # Nội suy đều góc giữa các mẫu; cần cho scan matcher của slam_toolbox.
    angle_compensate: true

    # Chỉ đặt true khi LiDAR được gắn lộn ngược về mặt vật lý. Hiện tại chưa
    # có evidence gắn ngược nên giữ false.
    inverted: false

    # scan_mode CỐ Ý bỏ trống. Không phải mọi mode đều tồn tại trên mọi
    # firmware A1; đặt một mode không hỗ trợ sẽ làm node chết ngay lúc start.
    # Chỉ thêm sau khi driver tự liệt kê mode mà thiết bị thật báo cáo.
