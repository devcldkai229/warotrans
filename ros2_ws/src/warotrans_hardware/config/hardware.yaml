# Wheel geometry shared by wheel_odom_node (odometry) and esp32_bridge_node, which sends it to the ESP32 as
# C mpt_l / mpt_r (metres per tick = 2*pi*r/ticks, PI speed measurement) and C sep (mixer). One source, so the
# firmware PI and the odometry cannot disagree (until 2026-11-19 the firmware had 2478.1 ticks and the old radii
# hardcoded: the right wheel ran 0.53 % fast). Both nodes load this file (hardware.launch.py), nothing else does.
# Do NOT repeat these keys under a node block: a node-specific value overrides this wildcard block.
/**:
  ros__parameters:
    # Operator re-measure 2026-09-07 — see docs/calibration.md
    # Operator 2026-11-11: robot pushed on the floor, 10 turns of each front (encoder) wheel counted.
    ticks_per_rev_left: 2481.9
    ticks_per_rev_right: 2468.6
    # 2026-11-20 LiDAR ICP, 2 x 1.9 m fwd/rev at 0.30 / 0.18 m/s (4-wheel firmware): odom 0.13 % short -> x1.0013;
    # heading still drifted +1.19 deg/m fwd / -1.75 deg/m rev = the right side ~0.8 % faster than the encoders said
    # (track 0.24 m assumed) -> right +0.41 %, left -0.41 %. Was 0.03340 / 0.03306 (2026-11-18).
    # Re-check: drift 0.79 deg/m fwd, -0.62 deg/m rev, odom distance 0.00 % fwd; front wheels still ~0.37 % apart
    # forward (0.11 % reverse) -> another +-0.125 % (forward weighted: the robot drives forward almost always).
    wheel_radius_left: 0.03327
    wheel_radius_right: 0.03328
    # Effective (slip) separation for in-place turns. 2026-11-20 LiDAR ICP, 2 x 360 deg at 0.6 rad/s: 0.385 m CCW /
    # 0.416 m CW, combined 0.400 (2026-11-18: 0.378 / 0.413 -> 0.395; before 0.4535, which turned the robot 11-19 %
    # faster than commanded). Used by the odometry yaw and the ESP32 mixer.
    # Final 2026-11-20: three runs 0.400 / 0.394 / 0.393 (front encoders vs LiDAR) -> 0.396.
    wheel_separation: 0.396
    # Rear wheel encoders (operator 2026-11-20: LR C2/C1 GPIO12/13, RR GPIO14/15, 3V3). Signs verified (all four count
    # up driving forward). 2026-11-20 straight runs: rear/front ticks RL 0.9981, RR 1.0042 -> the rear radius below
    # makes a rear wheel read the same distance as its front wheel. (In-place turns the rear wheels only turn 53-72 %
    # of the front ones: skid. That is why wheel_rear_encoder_feedback stays false.)
    ticks_per_rev_rear_left: 2481.9
    ticks_per_rev_rear_right: 2468.6
    wheel_radius_rear_left: 0.03333
    wheel_radius_rear_right: 0.03314

esp32_bridge_node:
  ros__parameters:
    serial_port: /dev/warotrans
    baud_rate: 921600
    # Drive tuning pushed to the ESP32 on connect (firmware "C" commands, needs the
    # 2026-10-16 warotrans_low_level build). 0 / false = old open-loop behaviour.
    # MEASURE before changing — procedure in docs/navigation-hardening.md:
    #   wheel_min_start_duty: lowest duty (0..153) at which an in-place spin starts
    #   closed loop: kp / ki from the step test (duty per m/s error, per metre)
    # Floor in-place spin 2026-10-16 (wheels on ground, operator present):
    #   w=0.15 rad/s bursts: duty 0 ~5° WEAK; 15 ~31°; 25 ~47°; 35 ~62°.
    #   Operator: go4 (35) visibly clearer/stronger than go2/go3 → use 35.
    wheel_min_start_duty: 35
    # Lab 2026-11-11 (docs/LAB_CALIBRATION_2026-11-11.md): open loop drove both wheels at 0.13-0.15 m/s for a
    # 0.068 m/s target (0.3 rad/s in place), the forward wheel 17-44 % faster than the reverse one. PI on the
    # encoders, kp 600 / ki 1500: 0.068 +- 0.003 m/s within ~1 s, symmetric, no oscillation; straight 0.040 m/s
    # exact. 6 Nav2 legs ran with it. kp 250 / ki 800 was too slow (still 0.08 m/s after 1 s).
    wheel_velocity_closed_loop: true
    wheel_velocity_kp: 600.0
    wheel_velocity_ki: 1500.0
    # Rear encoders, ENABLE IN THIS ORDER on the robot: (1) wheels lifted, slow forward: all four counts must rise
    # (flip rear_invert_* where a rear count falls; no reflash); (2) measure the rear m/tick; (3) feedback on.
    # Feedback on = the PI measures each side as the mean of front and rear wheel. With a wrong rear sign that mean
    # is ~0 and the PI would drive full duty; the firmware then switches it off by itself ("K FAULT rear_fb").
    rear_invert_left: false
    rear_invert_right: false
    # 2026-11-20: OFF on purpose. Straight, front and rear agree within 0.5 %; turning in place the rear wheels run
    # 53-72 % of the front ones (CW right side 101 %): the 50 % plausibility guard would latch mid-turn, and a mean
    # front/rear feedback would push the front wheels harder into the skid. Rear encoders feed odometry / slip only.
    wheel_rear_encoder_feedback: false

wheel_odom_node:
  ros__parameters:
    # ticks_per_rev_* / wheel_radius_* / wheel_separation: the "/**" block at the top of this file.
    # true = each side's distance is the mean of its front and rear wheel (after the rear signs / m/tick are
    # verified, see esp32_bridge_node above). /wheel_slip (front vs rear per side) is published either way.
    use_rear_encoders: true  # 2026-11-20: signs + m/tick verified on the floor (LiDAR)
    # With use_rear_encoders: while a side's front and rear wheel differ by > 20 % (/wheel_slip), the /odom vx/vy
    # variance is x100 so the EKF leans on the IMU instead of a slipping wheel.
    slip_variance_threshold: 0.2
    slip_variance_scale: 100.0
    odom_frame: odom
    base_frame: base_footprint
    # true = wheel owns TF odom→base_footprint (Phase 0 default).
    # false when bringup enable_ekf:=true (EKF is sole TF publisher).
    publish_tf: true
    # PROVISIONAL tuning (not physical constants). Large twist yaw variance so
    # EKF trusts BNO055 gyro for heading when skid-steer slips.
    pose_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.05]
    twist_covariance_diagonal: [0.01, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.1]
    serial_port: "/dev/warotrans"
    baud_rate: 921600
