esp32_bridge_node:
  ros__parameters:
    serial_port: /dev/warotrans
    baud_rate: 921600
    # Drive tuning pushed to the ESP32 on connect (firmware "C" commands, needs the
    # 2026-10-16 warotrans_low_level build). 0 / false = old open-loop behaviour.
    # MEASURE before changing — procedure in docs/navigation-hardening.md:
    #   wheel_min_start_duty: lowest duty (0..153) at which an in-place spin starts
    #   closed loop: kp / ki from the step test (duty per m/s error, per metre)
    # Floor in-place spin 2026-10-16 (wheels on ground, operator present):
    #   w=0.15 rad/s bursts: duty 0 ~5° WEAK; 15 ~31°; 25 ~47°; 35 ~62°.
    #   Operator: go4 (35) visibly clearer/stronger than go2/go3 → use 35.
    wheel_min_start_duty: 35
    wheel_velocity_closed_loop: false
    wheel_velocity_kp: 0.0
    wheel_velocity_ki: 0.0

wheel_odom_node:
  ros__parameters:
    # Operator re-measure 2026-09-07 — see docs/calibration.md
    ticks_per_rev_left: 2478.1
    ticks_per_rev_right: 2478.1
    wheel_radius_left: 0.03296
    wheel_radius_right: 0.03263
    # Effective separation (operator 2026-09-07): mean(0.4274, 0.4795) ≈ 0.4535 m
    wheel_separation: 0.4535

    odom_frame: odom
    base_frame: base_footprint
    # true = wheel owns TF odom→base_footprint (Phase 0 default).
    # false when bringup enable_ekf:=true (EKF is sole TF publisher).
    publish_tf: true
    # PROVISIONAL tuning (not physical constants). Large twist yaw variance so
    # EKF trusts BNO055 gyro for heading when skid-steer slips.
    pose_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.05]
    twist_covariance_diagonal: [0.01, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.1]
    serial_port: "/dev/warotrans"
    baud_rate: 921600
