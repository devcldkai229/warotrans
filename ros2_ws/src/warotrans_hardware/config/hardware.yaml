esp32_bridge_node:
  ros__parameters:
    serial_port: /dev/warotrans
    baud_rate: 921600

wheel_odom_node:
  ros__parameters:
    # Operator re-measure 2026-09-07 — see docs/calibration.md
    ticks_per_rev_left: 2478.1
    ticks_per_rev_right: 2478.1
    wheel_radius_left: 0.03296
    wheel_radius_right: 0.03263
    # Effective separation (operator 2026-09-07): mean(0.4274, 0.4795) ≈ 0.4535 m
    wheel_separation: 0.4535

    odom_frame: odom
    base_frame: base_footprint
    # true = wheel owns TF odom→base_footprint (Phase 0 default).
    # false when bringup enable_ekf:=true (EKF is sole TF publisher).
    publish_tf: true
    # PROVISIONAL tuning (not physical constants). Large twist yaw variance so
    # EKF trusts BNO055 gyro for heading when skid-steer slips.
    pose_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.05]
    twist_covariance_diagonal: [0.01, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.1]
    serial_port: "/dev/warotrans"
    baud_rate: 921600
