# Stage-2 overlay: GridBased → LaneAwareNavfn (hard ONE_WAY).
# lanes_json is overridden at launch from the MAP-ONE bundle path.
# Rollback: set plugin back to nav2_navfn_planner::NavfnPlanner (or omit this overlay).

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "warotrans_lane_planner::LaneAwareNavfn"
      lanes_json: ""
      # Slightly wider soft corridor so parking leave prefers lane centre over wall clip.
      corridor_margin: 0.08
      # Traversal hard-block = true LETHAL only (254). INSCRIBED(253) stays high soft-cost
      # (same as NavFn). Treating 253 as impassable + ONE_WAY caused empty mid-route replans
      # in free aisles that offline occupancy A* could still solve.
      lethal_cost: 254
      # Start/goal may sit in INSCRIBED (253) near walls; only LETHAL(254) blocks seeding.
      start_goal_lethal_cost: 254
      tolerance: 0.15
      allow_unknown: true
