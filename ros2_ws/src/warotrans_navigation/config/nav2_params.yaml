# =============================================================================
# WaroTrans Nav2 Parameters (Phase 0)
# =============================================================================
# PURPOSE
#   Full Nav2 stack configuration for autonomous navigation.
#
# ROBOT SPECS (from calibration.yaml / geometry.yaml)
#   - Chassis: 0.320 m × 0.260 m
#   - Footprint: [[0.16,0.13],[0.16,-0.13],[-0.16,-0.13],[-0.16,0.13]]
#   - max_linear: 0.128 m/s @ 40% PWM (PROVISIONAL)
#   - max_angular: 0.56 rad/s @ 40% PWM (PROVISIONAL)
#   - Nav2 uses 80%: max_vel_x=0.10, max_vel_theta=0.45
#
# TUNING markers indicate values that may need adjustment
# PROVISIONAL markers indicate values pending real measurement
# =============================================================================

# -----------------------------------------------------------------------------
# BT Navigator
# -----------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Resilient BT: FollowPath fail → clear local → wait → replan (không abort ngay)
    # Absolute path set by navigation.launch.py if left empty here.
    default_nav_to_pose_bt_xml: ""
    # default_nav_through_poses_bt_xml: ""
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# -----------------------------------------------------------------------------
# Controller Server (Regulated Pure Pursuit)
# -----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5  # non-holonomic
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /odom
    # Phase 3: SpeedFilter → controller (only when enable_costmap_filters:=true)
    speed_limit_topic: "speed_limit"

    # CRITICAL: esp32_bridge_node expects geometry_msgs/Twist, NOT TwistStamped
    enable_stamped_cmd_vel: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Slow platform (~0.1 m/s): allow longer rotate-to-heading / slow crawl.
      required_movement_radius: 0.08
      movement_time_allowance: 45.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15       # TUNING: metres
      yaw_goal_tolerance: 0.25      # TUNING: radians (~14°)

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # PROVISIONAL velocities: 80% of measured max (see calibration.yaml)
      desired_linear_vel: 0.10     # PROVISIONAL: 0.128 × 0.8 — keep; do not raise without measurement
      # Lookahead ~1 chassis length (0.32 m): shorter than 0.35 to reduce cutting 90° shelf corners
      lookahead_dist: 0.25
      min_lookahead_dist: 0.18
      max_lookahead_dist: 0.45
      lookahead_time: 1.5
      # Below provisional max_angular ~0.45 @ 40% PWM — slightly softer for in-place align
      rotate_to_heading_angular_vel: 0.35
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # Class D: abort FollowPath when carrot path intersects lethal/high cost (shelves)
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      # Slow earlier on tight curves (warehouse 90°); still above crawl min_speed
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.05
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      # Class A: stop-and-rotate when heading error large before translating (skid-steer 90° turns)
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785  # ~45°
      max_angular_accel: 0.8       # TUNING
      # Slightly wider latch after enabling rotate-to-heading (in-place spin can leave path briefly)
      max_robot_pose_search_dist: 2.0
      interpolate_curvature_after_goal: false

# -----------------------------------------------------------------------------
# Planner Server (NavFn Global Planner)
# -----------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.15              # TUNING: goal tolerance in metres
      use_astar: false             # Dijkstra by default
      allow_unknown: true

# -----------------------------------------------------------------------------
# Smoother Server
# -----------------------------------------------------------------------------
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# -----------------------------------------------------------------------------
# Behavior Server (recovery behaviors)
# -----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    # PROVISIONAL velocities
    max_rotational_vel: 0.45
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.8

# -----------------------------------------------------------------------------
# Velocity Smoother
# -----------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # PROVISIONAL velocities
    max_velocity: [0.10, 0.0, 0.45]
    min_velocity: [-0.10, 0.0, -0.45]
    max_accel: [0.5, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -0.8]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

    # CRITICAL: esp32_bridge_node expects geometry_msgs/Twist, NOT TwistStamped
    enable_stamped_cmd_vel: false

# -----------------------------------------------------------------------------
# Waypoint Follower
# -----------------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# -----------------------------------------------------------------------------
# Local Costmap
# -----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05             # matches map resolution
      # Footprint 0.320 × 0.260 m
      footprint: "[[0.16, 0.13], [0.16, -0.13], [-0.16, -0.13], [-0.16, 0.13]]"
      plugins: ["voxel_layer", "inflation_layer"]
      # Outdoor default: omit filters key (empty [] crashes rclcpp on Jazzy).
      # Phase 3: enable_costmap_filters:=true merges nav2_params_filters_on.yaml
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: false
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # KEEP 0.15 / 2.0: half-width footprint ~0.13 m; do NOT shrink to “fit” shelves.
        # Class D (cmd~0 near shelves) handled by RPP collision_detection + rotate_to_heading.
        cost_scaling_factor: 2.0
        inflation_radius: 0.15
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: false
        filter_info_topic: "/keepout_costmap_filter_info"
      always_send_full_costmap: true

# -----------------------------------------------------------------------------
# Global Costmap
# -----------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.3
      # Footprint 0.320 × 0.260 m
      footprint: "[[0.16, 0.13], [0.16, -0.13], [-0.16, -0.13], [-0.16, 0.13]]"
      resolution: 0.05             # matches map resolution
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # Outdoor default: omit filters key (empty [] crashes rclcpp on Jazzy).
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          inf_is_valid: false
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Same as local — keep safety margin; do not reduce for aisle fit.
        cost_scaling_factor: 2.0
        inflation_radius: 0.15
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: false
        filter_info_topic: "/keepout_costmap_filter_info"
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: false
        filter_info_topic: "/speed_costmap_filter_info"
        speed_limit_topic: "/speed_limit"
      always_send_full_costmap: true

# -----------------------------------------------------------------------------
# Phase 3 — Costmap filter mask / info servers
# -----------------------------------------------------------------------------
keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: "/keepout_filter_mask"
    # yaml_filename set by launch

keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0
    filter_info_topic: "/keepout_costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

speed_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: "/speed_filter_mask"
    # yaml_filename set by launch

speed_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 2
    filter_info_topic: "/speed_costmap_filter_info"
    mask_topic: "/speed_filter_mask"
    base: 0.0
    multiplier: 0.01

# -----------------------------------------------------------------------------
# Collision Monitor (optional safety layer)
# -----------------------------------------------------------------------------
# Phase 0: disabled (polygons/observation_sources empty).
# Phase 0.5 FRONT/REAR: do NOT invent mounts. After geometry OK, follow
# docs/ultrasonic-front-rear-nav2.md and config/nav2_collision_front_rear.yaml
# (requires remapping controller → /cmd_vel_nav). LEFT/RIGHT not used.
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # Disable for Phase 0; enable after FRONT/REAR mounts measured
    polygons: []
    observation_sources: []
