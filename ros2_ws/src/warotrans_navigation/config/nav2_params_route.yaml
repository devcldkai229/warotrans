# =============================================================================
# Lane-graph navigation overlay — merged last by navigation.launch.py only when route_graph:=<file> is set.
# =============================================================================
# The route path is the drawn lane centre line, not a costmap-optimal path. In the demo lanes (0.45 m between a
# shelf and the next lane, robot 0.26 m wide → ~0.095 m each side) pure pursuit with a 0.30 m lookahead cuts the
# corners by several cm, the footprint then grazes the shelf and RPP stops ("collision ahead") until a BackUp
# recovery. A shorter lookahead keeps the robot on the centre line (Gazebo trace 2026-10-24, upper corridor).
# =============================================================================
controller_server:
  ros__parameters:
    FollowPath:
      lookahead_dist: 0.20
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.30
      lookahead_time: 1.0
      curvature_lookahead_dist: 0.20
