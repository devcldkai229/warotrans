# =============================================================================
# WaroTrans Nav2 — SIMULATION overlay (merged last, after nav2_params.yaml)
# =============================================================================
# Real-robot speeds (0.10 m/s) are PROVISIONAL limits of the physical motors.
# The simulated diff drive has no such limit, so the demo runs faster here.
# This file is only loaded by warotrans_simulation launches — never on the Pi.
#
# 2026-10-27: V018 aisles ~0.45 m shelf-to-lane; centreline is only ~0.22 m from
# shelf face. Base inflation 0.35 (and even 0.25) keeps the lane centre in high
# cost → RPP "collision ahead" → rotate_to_heading loop (~1 min in-place spin).
# Sim-only: inflation 0.15 keeps centreline clear; disable rotate_to_heading so a
# brief collision-ahead does not become an in-place spin until progress abort.
# Keep route lookahead from nav2_params_route.yaml. Do not invent wheel calib.
# =============================================================================

controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.35
      # Pivot in place when the lane turns > rotate_to_heading_min_angle (base 45°) or a new MOVE starts
      # facing away from the route (e.g. leaving EP-INBOUND nose-to-wall). Arcing instead cut corners
      # into shelves/walls. The old in-aisle spin loop came from FollowPath poses with zero quaternions
      # (always "rotate to yaw 0"); Nav2SegmentExecutor now orients every pose along the lane.
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.45
      # Match local inflation_layer below (RPP uses this for collision scaling).
      inflation_cost_scaling_factor: 3.0
      # Slightly more patient before declaring carrot collision in tight aisles.
      max_allowed_time_to_collision_up_to_carrot: 1.5
      # Active Mode ends every traffic segment at a safe-stop node. Without this, curvature to a carrot
      # pinned on the goal blows up in the last ~0.2 m and the robot swirls ~90° off the lane before
      # stopping, then arcs into the shelf on the next segment (Gazebo trace 2026-10-27, node 26).
      use_fixed_curvature_lookahead: true
      interpolate_curvature_after_goal: true

local_costmap:
  local_costmap:
    ros__parameters:
      # V018 EP-INBOUND sits ~0.21 m from the west wall face; with 0.16 m half-length + 2 cm padding on a
      # 5 cm grid, lidar noise on the cell boundary marks the goal itself as lethal → "collision ahead".
      # Sim has no odometry noise to pad for; finer grid keeps the wall cell where the wall is.
      # Real fix: move EP-INBOUND ≥ 0.10 m off the wall in the map editor.
      resolution: 0.025
      footprint_padding: 0.0
      inflation_layer:
        inflation_radius: 0.15
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.15
        cost_scaling_factor: 3.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [0.8, 0.0, 1.5]
    max_decel: [-0.8, 0.0, -1.5]
