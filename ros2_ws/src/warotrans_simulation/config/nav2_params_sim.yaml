# =============================================================================
# WaroTrans Nav2 — SIMULATION overlay (merged last, after nav2_params.yaml)
# =============================================================================
# Real-robot speeds (0.10 m/s) are PROVISIONAL limits of the physical motors.
# The simulated diff drive has no such limit, so the demo runs faster here.
# This file is only loaded by warotrans_simulation launches — never on the Pi.
#
# 2026-11-02 (MAP-ONE-V001, measured on maps/map_one_v001/map.pgm): padded footprint
# is 0.36x0.30 → half-width 0.15, circumscribed radius 0.234. Escaping the EP-PARKING-A
# pocket eastward REQUIRES y <= -0.85 (at y >= -0.80 EP-INBOUND is unreachable), and the
# widest line through the pillar gap is y ~ -0.99 at 0.30-0.41 m clearance.
# inflation 0.15 geodesiced along y ~ -0.84 at only 0.150 m clearance -- zero margin for
# the padded footprint, which is where Collision Monitor held (111/120 samples).
# inflation 0.35 moves the plan to the corridor centre: min clearance 0.150 → 0.300.
# EP-INBOUND needs a ~180 deg terminal spin (goal faces south, wall 0.317 m to the north),
# so rotate_to_heading must be ON, but only near the goal -- see FollowPath below.
# Merged LAST (after nav2_params_route.yaml). Raise lookahead with sim speed so v/L ≤ ~1.2.
# Do not invent wheel calib; do not disable Collision Monitor / Motion Authority.
# =============================================================================

controller_server:
  ros__parameters:
    # NOTE: controller_patience is a move_base name, not a Nav2 controller_server
    # parameter -- it was silently dropped. failure_tolerance is the real knob.
    failure_tolerance: 3.0
    # MAP-ONE C-aisle: Collision Monitor holds cmd_vel for long stretches; 20 s progress
    # window aborts while the robot is legally waiting on FootprintApproach (not a stall).
    progress_checker:
      required_movement_radius: 0.08
      # CM approach near parking walls briefly zeros cmd_vel; need longer window.
      movement_time_allowance: 50.0
    FollowPath:
      # Keep plugin explicit so overlay never leaves FollowPath on DWB defaults.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Straighter lane track (user: avoid sin-wave). Short L=0.20 + fixed curvature chased
      # jagged A* corners → weave. L=0.28 @ v=0.20 keeps v/L≤0.72; no SmoothPath in BT.
      desired_linear_vel: 0.20
      lookahead_dist: 0.28
      min_lookahead_dist: 0.22
      max_lookahead_dist: 0.40
      curvature_lookahead_dist: 0.28
      # RPP only reaches the goal yaw via shouldRotateToGoalHeading(), which needs
      # use_rotate_to_heading ON. Earlier regressions came from min_angle 0.785 firing
      # mid-path pivots inside 0.15-0.20 m corridors (needs 0.234 to rotate).
      # Measured heading error on leaving EP-PARKING-A is ~1.1 rad, so 1.4 suppresses
      # the start and mid-path pivots; the terminal rotation is NOT gated by min_angle.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.4
      rotate_to_heading_angular_vel: 0.45
      inflation_cost_scaling_factor: 3.0
      max_allowed_time_to_collision_up_to_carrot: 3.0
      # Required for CM A/B: RPP collision stays ON; do not disable to pass CM tests.
      use_collision_detection: true
      # RPP throws at configure() when allow_reversing and use_rotate_to_heading are
      # both true. Forward-only also restores the FollowPath contract in nav2_params.yaml.
      allow_reversing: false
      use_fixed_curvature_lookahead: false
      interpolate_curvature_after_goal: false
    FollowPathReverse:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      use_collision_detection: true
      use_rotate_to_heading: false
      allow_reversing: true
      inflation_cost_scaling_factor: 3.0
    general_goal_checker:
      # RPP takes goal_dist_tol_ from this xy tolerance to open the terminal-rotation
      # gate. Measured around EP-INBOUND: clearance 0.267 at 0.05 m but 0.217 at 0.10 m
      # (< 0.234), so rotating is only safe within ~0.05-0.07 m. 0.08 keeps the spin in
      # the clear pocket and is still well inside the 0.20 m acceptance threshold.
      # yaw: ~23° — must face endpoint heading (was π = ignore).
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.40

local_costmap:
  local_costmap:
    ros__parameters:
      inflation_layer:
        # 0.15 was below the circumscribed radius 0.234, so the gradient never pushed the
        # plan off the pillar (min clearance 0.150). 0.35 centres it (0.300-0.412) --
        # this tightens obstacle avoidance, it does not relax any safety margin.
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [0.8, 0.0, 1.2]
    max_decel: [-0.8, 0.0, -1.2]
    scale_velocities: true

# MAP-ONE metrics (chassis 0.32×0.26, aisle ~0.45 m → side clearance ~0.07–0.10 m):
#   look_ahead_m ≈ v_sim(0.24) * time_before_collision
#   0.10 s → ~0.024 m — approach action effectively inert (was debug-only)
#   0.20 s → ~0.048 m | 0.30 s → ~0.072 m (production aisle floor)
# 2026-11-02: raised to 0.25 now that inflation 0.35 routes the plan down the corridor
# centre, so the horizon no longer fights a 0.150 m-clearance geodesic.
# Toggle FootprintApproach.enabled for A/B: true=CM_ON, false=CM_OFF (debug leave).
collision_monitor:
  ros__parameters:
    polygons: ["FootprintApproach"]
    observation_sources: ["scan"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      time_before_collision: 0.25
      simulation_time_step: 0.05
      min_points: 4
      enabled: true
      visualize: true
    scan:
      type: "scan"
      topic: "scan"
      enabled: true
