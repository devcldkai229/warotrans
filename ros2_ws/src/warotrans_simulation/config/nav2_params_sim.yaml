# =============================================================================
# WaroTrans Nav2 — SIMULATION overlay (merged last, after nav2_params.yaml)
# =============================================================================
# Real-robot speeds (0.10 m/s) are PROVISIONAL limits of the physical motors.
# The simulated diff drive has no such limit, so the demo runs faster here.
# This file is only loaded by warotrans_simulation launches — never on the Pi.
# =============================================================================

controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.35
      rotate_to_heading_angular_vel: 0.8

# Demo warehouse 11 x 7.5 m (aisles between racks 1.15 m): with the real-robot inflation (0.15 m) NavFn hugs shelf edges and
# RPP's footprint check reports "collision ahead". A wider cost keeps paths in the middle of the aisles
# while still letting the robot reach docking points 0.35 m from a shelf. Only larger margins — never smaller.
local_costmap:
  local_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.35
        cost_scaling_factor: 4.0

global_costmap:
  global_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.35
        cost_scaling_factor: 4.0

velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [0.8, 0.0, 1.5]
    max_decel: [-0.8, 0.0, -1.5]
