# =============================================================================
# WaroTrans Nav2 — SIMULATION overlay (merged last, after nav2_params.yaml)
# =============================================================================
# Real-robot speeds (0.10 m/s) are PROVISIONAL limits of the physical motors.
# The simulated diff drive has no such limit, so the demo runs faster here.
# Costmaps, inflation (0.35 / 4.0), BT and collision_monitor come from the base nav2_params.yaml,
# so Gazebo exercises the same navigation config as the Pi.
# This file is only loaded by warotrans_simulation launches — never on the Pi.
# =============================================================================

controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.35
      rotate_to_heading_angular_vel: 0.8

velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.0, 1.0]
    min_velocity: [-0.2, 0.0, -1.0]
    max_accel: [0.8, 0.0, 1.5]
    max_decel: [-0.8, 0.0, -1.5]
