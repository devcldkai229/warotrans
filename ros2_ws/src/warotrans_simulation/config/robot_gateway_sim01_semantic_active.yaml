# Stage-3 SIM-01: Nav2 semantic + real traffic grants (no open-grant, no RouteGraph).
robot_gateway:
  ros__parameters:
    use_sim_time: true
    robot_code: "RBT-SIM-01"
    mqtt_host: "127.0.0.1"
    mqtt_port: 1883
    mqtt_client_id: "warotrans-robot-gateway-sim-01-s3"
    topic_prefix: "warotrans/v1"
    map_version_code: "MAP-ONE-V001"
    map_frame: "map"
    base_frame: "base_link"
    odom_topic: "odom"
    amcl_pose_topic: "amcl_pose"
    navigate_action: "navigate_to_pose"
    heartbeat_hz: 1.0
    telemetry_hz: 5.0
    max_transform_age_sec: 2.0
    simulated_battery_percent: 87.0
    teleop_enabled: true
    cmd_vel_topic: "cmd_vel_safe"
    traffic_mode: "semantic_active"
    enable_authority_gate: true
    authority_ok_topic: "traffic/authority_ok"
    authority_state_path: "/tmp/warotrans_authority_state_sim01.json"
    semantic_map_fingerprint: ""
    plan_topic: "plan"
    lanes_json: ""
    no_stop_json: ""
    keepout_json: ""
    single_occupancy_json: ""
    # 2026-11-13 tolerance study (docs/simulation/07 §9): 0.12 m / 0.20 rad, same as Nav2's goal checker
    # (nav2_params_sim.yaml) and the endpoints' position_tolerance in the DB. Was 0.10 m / 0.15 rad.
    arrival_refine_xy_m: 0.12
    arrival_refine_yaw_rad: 0.20
    docking_arrive_xy_m: 0.12
    docking_align_yaw_rad: 0.20
