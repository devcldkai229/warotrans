# =============================================================================
# WaroTrans simulation — ACTIVE layout: MAP-ONE-V006 (lab scan warotrans_lab_111026, 2026-11-10/11)
# =============================================================================
# The map the real robot runs on (backend appsettings RealRobot / Simulation: map_one_v006).
# Occupancy straight from the robot's scan: 70x102 px, origin (-1.424, -1.658), resolution 0.05 m (3.5 x 5.1 m).
# PGM cell -> map: x = -1.424 + 0.05*(col + 0.5), y = -1.658 + 0.05*(101.5 - row).
# V005 and V006 share the PGM, lanes, zones and endpoints; V006 only lowers ZONE-SPEED-ZONE-BOUND to 0.06 m/s.
#
# Rebuild (no backend needed, from the snapshot committed in warotrans-system):
#   python3 scripts/sync_web_map.py --snapshot <warotrans-system>/samples/maps/MAP-ONE-V006
# or from a running backend:
#   python3 scripts/sync_web_map.py --user admin --password '...'
#
# Previous layouts: config/layouts/remap_20261104_v3_map_one_v004.yaml (MAP-ONE-V004),
#                   config/layouts/map_wh42cfe65f_v003.yaml
# =============================================================================

name: sim_warehouse
source_map: maps/real/warotrans_lab_111026.yaml
wall_height: 0.8

web:
  backend: http://localhost:5090
  map_version_id: e89a972a-d52f-485e-8d95-e36bc7c201b1
  map_version_code: MAP-ONE-V006
  overlay: maps/real/map_one_v006_overlay.json

# Robot spawns on Parking A (pose from web.overlay), facing west like the endpoint.
spawn_endpoint_code: EP-PARKING-A
spawn: { x: -0.541, y: 2.468, yaw: 3.14159 }   # fallback when no overlay is available

# The scan is used as is: every occupied cell is a solid block from the floor (racks / partitions included), so the
# simulated lidar sees exactly what AMCL / Nav2 see on the map. No rack decoration: the scan does not say which
# blocks are racks, and decorating them would only change the look.
clear_cells: []
shelves: []
