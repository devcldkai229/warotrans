# Stage-1 Nav2-centric free-space (MAP-ONE). NavigateToPose without Route Server.
# Authority gate stays ON; stage1_open_grant_node publishes /traffic/authority_ok.
robot_gateway:
  ros__parameters:
    use_sim_time: true
    robot_code: "RBT-SIM-01"
    mqtt_host: "127.0.0.1"
    mqtt_port: 1883
    mqtt_client_id: "warotrans-robot-gateway-sim-01-semantic"
    topic_prefix: "warotrans/v1"
    map_version_code: "MAP-ONE-V001"
    map_frame: "map"
    base_frame: "base_link"
    odom_topic: "/odom"
    amcl_pose_topic: "/amcl_pose"
    navigate_action: "navigate_to_pose"
    heartbeat_hz: 1.0
    telemetry_hz: 5.0
    max_transform_age_sec: 2.0
    simulated_battery_percent: 87.0
    teleop_enabled: true
    # Gate is between collision_monitor and /cmd_vel; gateway teleop uses gated topic.
    cmd_vel_topic: "/cmd_vel_safe"
    traffic_mode: "legacy"
    enable_authority_gate: true
    # No route_server / segment executor in Stage 1.
