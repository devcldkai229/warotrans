# Stage-3 SIM-02: Nav2 semantic + real traffic grants.
robot_gateway:
  ros__parameters:
    use_sim_time: true
    robot_code: "RBT-SIM-02"
    mqtt_host: "127.0.0.1"
    mqtt_port: 1883
    mqtt_client_id: "warotrans-robot-gateway-sim-02-s3"
    topic_prefix: "warotrans/v1"
    map_version_code: "MAP-ONE-V001"
    map_frame: "map"
    base_frame: "base_link"
    odom_topic: "odom"
    amcl_pose_topic: "amcl_pose"
    navigate_action: "navigate_to_pose"
    heartbeat_hz: 1.0
    telemetry_hz: 5.0
    max_transform_age_sec: 2.0
    simulated_battery_percent: 90.0
    teleop_enabled: true
    cmd_vel_topic: "cmd_vel_safe"
    traffic_mode: "semantic_active"
    enable_authority_gate: true
    authority_ok_topic: "traffic/authority_ok"
    authority_state_path: "/tmp/warotrans_authority_state_sim02.json"
    semantic_map_fingerprint: ""
    plan_topic: "plan"
    lanes_json: ""
    no_stop_json: ""
    keepout_json: ""
    single_occupancy_json: ""
