# =============================================================================
# WaroTrans AMCL Configuration (Nav2 Phase 0)
# =============================================================================
# PURPOSE
#   AMCL parameters for localization within a pre-built map.
#   AMCL owns the map -> odom transform during navigation.
#
# NOTES
#   - EKF variant (enable_ekf:=true, the default of tools/pi_run_semantic.sh). Motion comes from the EKF, whose
#     heading is the BNO055 (within 0.07 % of the LiDAR, 2026-11-18), not from the slipping wheel yaw: alpha1-4
#     stay low (0.15). Raising them would only spread the particles. amcl_wheel_only.yaml is the no-EKF variant.
#   - robot_model_type: nav2_amcl::DifferentialMotionModel (the Nav2 name of ROS 1 "diff-corrected")
#   - Light for the Pi 5 CPU (2026-11-11, commit 2cc95f2): 300-800 particles; AMCL after turns 0.02-0.04 m /
#     <= 2.4 deg against the scan match. The update thresholds and laser model are the same as RBT-002's
#     (amcl_rbt002.yaml), which tracks well with them.
#   - 2026-11-20 lab (MAP-ONE-V013, INBOUND): with 0.10 m / 0.15 rad updates and the soft laser model (sigma_hit 0.2,
#     likelihood field 2.0 m) AMCL stayed 10-14 cm behind the scan-match truth at the end of a slow docking run in, and
#     six in-place updates only moved it 14 -> 10 cm: the gateway kept driving into the wall (NAVIGATION_BLOCKED).
#     Now the amcl_wheel_only.yaml update / laser values (0.05 m, 0.08 rad, sigma_hit 0.1, 1.0 m); particles stay light.
#   - Keys tuned per variant (warotrans_navigation/test/test_recovery_tree.py TUNED_PER_SOURCE): alpha1-4,
#     update_min_d/a, sigma_hit, laser_likelihood_max_dist, min/max_particles, max_beams. Everything else must
#     match amcl_wheel_only.yaml.
#   - set_initial_pose: true — PROVISIONAL boot pose so map->odom exists for Nav2 activate.
#     Operator must overwrite via RViz "2D Pose Estimate" before trusting goals.
#
# TUNING markers indicate values that may need adjustment based on testing
# =============================================================================

amcl:
  ros__parameters:
    use_sim_time: false

    # ----- Frame IDs -----
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    # ----- Sensor -----
    scan_topic: "/scan"
    laser_max_range: 12.0      # RPLIDAR A1M8 max ~12m, matches slam_toolbox
    laser_min_range: 0.15      # A1M8 min ~0.15m
    # 2026-11-19: 60 -> 90 (one beam per 4 deg; RBT-002 and amcl_wheel_only.yaml use 90). 60 was chosen with the
    # particle cut on 2026-11-11 and is sparse at the lab's corners. CHECK the Pi load average after deploying.
    max_beams: 90

    # ----- Motion model (DifferentialMotionModel for skid-steer approx) -----
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Alpha parameters — noise in odometry motion model
    # 2026-10-16: odom→base_footprint now comes from the EKF (wheel velocities + BNO055 gyro
    # yaw, enable_ekf:=true), so rotation is no longer as noisy as raw skid-steer wheel yaw.
    # Lower than the wheel-only 0.3/0.2; raise again if running with enable_ekf:=false.
    alpha1: 0.15               # TUNING: rotation→rotation noise
    alpha2: 0.15               # TUNING: translation→rotation noise
    alpha3: 0.15               # TUNING: translation→translation noise
    alpha4: 0.15               # TUNING: rotation→translation noise
    alpha5: 0.1                # TUNING: translation→translation (strafe, usually 0 for diff)

    # ----- Particle filter -----
    min_particles: 300
    max_particles: 800        # Limit for Pi 5 CPU
    pf_err: 0.05               # KLD particle filter error
    pf_z: 0.99                 # KLD z-score

    # ----- Update thresholds (small room, frequent updates) -----
    update_min_d: 0.05   # 2026-11-20 lab: was 0.10
    update_min_a: 0.08   # 2026-11-20 lab: was 0.15

    # ----- Resample -----
    resample_interval: 1       # resample every N updates
    # 0 = no random particle injection. Shelf aisles look alike; injection teleported the
    # estimate into a neighbouring aisle (seen in the Gazebo warehouse: "success" while the
    # robot was elsewhere). Re-localize with RViz "2D Pose Estimate" instead.
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # ----- Laser likelihood model -----
    laser_model_type: "likelihood_field"
    z_hit: 0.95
    z_rand: 0.05
    sigma_hit: 0.1   # 2026-11-20 lab: was 0.2
    laser_likelihood_max_dist: 1.0   # 2026-11-20 lab: was 2.0

    # ----- Initial pose -----
    # PROVISIONAL boot pose so map->odom exists and Nav2 planner can activate.
    # Operator MUST overwrite with RViz "2D Pose Estimate" before trusting goals.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # ----- TF -----
    tf_broadcast: true
    transform_tolerance: 1.0

    # ----- Debug -----
    always_reset_initial_pose: false
    first_map_only: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""          # Overridden by launch argument

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
